<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Usman Younas | Developer Portfolio</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      color: #17202a;
      display: flex;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
    }
    .card {
      width: min(720px, 92%);
      background: white;
      padding: 50px 35px;
      border-radius: 18px;
      text-align: center;
      box-shadow: 0 12px 40px rgba(0,0,0,.08);
    }
    h1 { margin: 0 0 12px; font-size: 42px; }
    p { color: #5f6b76; font-size: 18px; line-height: 1.6; }
    .badge {
      display: inline-block;
      margin-top: 15px;
      padding: 10px 18px;
      border-radius: 30px;
      background: #eef7f0;
      color: #18753c;
      font-weight: bold;
    }
    footer { margin-top: 30px; font-size: 14px; color: #87919a; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Usman Younas</h1>
    <p>Oracle Developer • Laravel Developer • Web Applications • IT Consulting</p>
    <span class="badge">🚀 GitHub Pages Test Successful</span>
    <footer>This is a test portfolio page published with GitHub Pages.</footer>
  </main>
</body>
</html>
